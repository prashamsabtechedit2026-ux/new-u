<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form TWO</title>
</head>

<body>
    <form action="#" method="post">
        First Name : <input type="text" name=":firstname"> <br><br>
        Middle Name : <input type="text" name=":middlename"> <br><br>
        Last Name : <input type="text" name=":lastname"> <br><br>
        Email Address : <input type="email" name=":email"> <br><br>

        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="others"> Others <br><br>

        City you live in: <select name="city">
            <option disabled selected>--- Please Select Any Option ---</option>
            <option value="ltp"> Lalitpur</option>
            <option value="ktm"> Kathmandu </option>
            <option value="pkr"> Pokhara </option>
            <option value="bkt"> Bhaktapur </option>
            <option value="cht"> Chitwan </option>
        </select><br><br>

        Select your preferable game :
        <input type="checkbox" name="mstatus"> Cricket
        <input type="checkbox" name="mstatus"> Football
        <input type="checkbox" name="mstatus"> Board game
        <input type="checkbox" name="mstatus"> Badminton <br><br>
        Enter your description: <br>
        <textarea name="txtarea" rows="8" cols="40" style="resize: none;"></textarea><br><br>


        <input type="submit">
        <input type="button" value="BUTTON">
        <input type="reset" value="RESET">




    </form>
</body>

</html>
